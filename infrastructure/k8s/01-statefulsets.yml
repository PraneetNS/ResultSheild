---
# ============================================================
# Redis — StatefulSet + ClusterIP Service
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-primary
  namespace: resultshield
  labels:
    app: redis-primary
    tier: cache
spec:
  serviceName: redis-primary
  replicas: 1
  selector:
    matchLabels:
      app: redis-primary
  template:
    metadata:
      labels:
        app: redis-primary
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 1gb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: resultshield
  labels:
    app: redis-primary
spec:
  selector:
    app: redis-primary
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  clusterIP: None  # Headless for StatefulSet DNS

---
# ============================================================
# PostgreSQL — StatefulSet + ClusterIP Service
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: resultshield
  labels:
    app: postgres-primary
    tier: database
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          args: ["-c", "max_connections=200"]
          env:
            - name: POSTGRES_DB
              value: resultshield
            - name: POSTGRES_USER
              value: resultshield
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resultshield-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "resultshield"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "resultshield"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: resultshield
  labels:
    app: postgres-primary
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None

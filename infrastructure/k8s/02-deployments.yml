---
# ============================================================
# Result Service — Deployment (3 replicas) + HPA + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-service
  namespace: resultshield
  labels:
    app: result-service
    version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: result-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero downtime deployments
  template:
    metadata:
      labels:
        app: result-service
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: result-service
          image: resultshield/result-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql://resultshield:$(POSTGRES_PASSWORD)@postgres-primary:5432/resultshield"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resultshield-secrets
                  key: postgres-password
            - name: DATABASE_POOL_SIZE
              value: "20"
            - name: DATABASE_MAX_OVERFLOW
              value: "40"
            - name: DATABASE_QUERY_TIMEOUT
              value: "5000"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: resultshield-config
                  key: REDIS_URL
            - name: REDIS_CACHE_TTL
              value: "3600"
            - name: CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_TIMEOUT
              value: "30"
            - name: DEGRADED_MODE_ENABLED
              value: "true"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: resultshield-config
                  key: LOG_LEVEL
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name  # Pod name as instance ID
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: resultshield
  labels:
    app: result-service
spec:
  selector:
    app: result-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
# HPA — scale result-service from 3 to 20 replicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-service-hpa
  namespace: resultshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # React quickly to spikes
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Cool down for 5 min before shrinking
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
# ============================================================
# Waiting Room — Deployment + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waiting-room
  namespace: resultshield
  labels:
    app: waiting-room
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waiting-room
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: waiting-room
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: waiting-room
          image: resultshield/waiting-room:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: resultshield-config
          env:
            - name: PORT
              value: "8001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resultshield-secrets
                  key: waiting-room-jwt-secret
          ports:
            - containerPort: 8001
              name: http
            - containerPort: 8001
              name: ws
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: waiting-room
  namespace: resultshield
  labels:
    app: waiting-room
spec:
  selector:
    app: waiting-room
  ports:
    - port: 8001
      targetPort: 8001
      name: http

---
# ============================================================
# API Gateway — Deployment + HPA + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: resultshield
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: api-gateway
          image: resultshield/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: resultshield-config
          env:
            - name: PORT
              value: "3000"
            - name: RESULT_SERVICE_URL
              value: "http://result-service:8000"
            - name: WAITING_ROOM_URL
              value: "http://waiting-room:8001"
            - name: RATE_LIMIT_REQUESTS
              value: "100"
            - name: RATE_LIMIT_WINDOW
              value: "60"
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resultshield-secrets
                  key: jwt-secret
            - name: AUTH_JWT_EXPIRY
              value: "2h"
            - name: STABILITY_WINDOW
              value: "300000"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: resultshield
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: resultshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ============================================================
# AI Predictor — Deployment + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-predictor
  namespace: resultshield
  labels:
    app: ai-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-predictor
  template:
    metadata:
      labels:
        app: ai-predictor
    spec:
      containers:
        - name: ai-predictor
          image: resultshield/ai-predictor:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: resultshield-config
          env:
            - name: PORT
              value: "8002"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: WAITING_ROOM_URL
              value: "http://waiting-room:8001"
            - name: API_GATEWAY_URL
              value: "http://api-gateway:3000"
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: ai-predictor
  namespace: resultshield
spec:
  selector:
    app: ai-predictor
  ports:
    - port: 8002
      targetPort: 8002

---
# ============================================================
# Nginx Ingress + Service (LoadBalancer)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: resultshield
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: resultshield
  labels:
    app: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http

---
# ============================================================
# Monitoring — Prometheus + Grafana
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: resultshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.1
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-data
          emptyDir: {}
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: resultshield
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: resultshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: resultshield
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
